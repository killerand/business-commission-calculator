<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commission Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .result {
      margin-top: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 10px;
    }

    .result p {
      margin: 10px 0;
      font-size: 18px;
    }

    .amount {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="calculator">
  <h2>Commission Calculator</h2>

  <label>Product Price (¥)</label>
  <input type="number" id="price" placeholder="Enter product price" />

  <label>Commission (%)</label>
  <input type="number" id="commission" placeholder="Enter commission %" value="10" />

  <div class="result">
    <p>Sales Commission: ¥<span id="commissionAmount">0</span></p>
    <p class="amount">Amount Received: ¥<span id="receivedAmount">0</span></p>
  </div>
</div>

<script>
  const priceInput = document.getElementById("price");
  const commissionInput = document.getElementById("commission");

  const commissionAmount = document.getElementById("commissionAmount");
  const receivedAmount = document.getElementById("receivedAmount");

  function calculate() {
    const price = parseFloat(priceInput.value) || 0;
    const commission = parseFloat(commissionInput.value) || 0;

    const commissionValue = (price * commission) / 100;
    const received = price - commissionValue;

    commissionAmount.textContent = commissionValue.toLocaleString();
    receivedAmount.textContent = received.toLocaleString();
  }

  priceInput.addEventListener("input", calculate);
  commissionInput.addEventListener("input", calculate);
</script>

</body>
</html>
